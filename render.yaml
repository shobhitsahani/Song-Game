services:
  - type: web
    name: song-game-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        value: https://song-game-web.vercel.app
      - key: CORS_ORIGIN
        value: https://song-game-web.vercel.app
      - key: NODE_ENV
        value: production
