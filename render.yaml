services:
  - type: web
    name: song-game-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx turbo run db:generate build --filter=apps-api
    startCommand: npm run start --workspace=apps-api
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URL
        value: https://song-game-alpha.vercel.app
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
